<title>HubOfertas | Ofertas Premium</title>
<style>
*{box-sizing:border-box}
:root{--gold:#ffd700;--dark:#080808}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif}
header{
text-align:center;padding:30px 12px;
background:radial-gradient(ellipse at top,#493400,#101010 70%);
border-bottom:1px solid #d5a900;
box-shadow:0 0 35px #b8860033
}
.logo{font-size:38px;font-weight:900;color:#ffd700;text-shadow:0 0 8px #ffd700,0 0 25px #d69e00}
.logo span{color:white}
header p{color:#ddd}
.banner{
margin:18px;padding:28px 12px;text-align:center;
border:1px solid #b88c18;border-radius:16px;
background:linear-gradient(120deg,#241900,#080808,#302000);
box-shadow:0 0 20px #ffd70030
}
.banner h1{color:#ffd700;text-shadow:0 0 12px #e8b500}
.banner p{color:#ddd}
.search{padding:12px 16px;max-width:800px;margin:auto}
input{
width:100%;padding:16px;border-radius:12px;
background:#171717;border:1px solid #d5ad32;
color:white;font-size:16px;outline:none;
box-shadow:0 0 12px #ffd70018
}
.categories{display:flex;gap:10px;overflow-x:auto;padding:12px 14px}
.categories button{
white-space:nowrap;padding:12px 17px;border-radius:30px;
background:#171717;border:1px solid #9c781a;color:#ffd700;
cursor:pointer
}
.categories button:hover,.categories button.active{
background:#ffd700;color:#080808;box-shadow:0 0 15px #ffd700
}
h2{padding:0 17px;color:#ffd700;text-shadow:0 0 10px #d5a900}
.resultado{padding:0 17px;color:#aaa;font-size:13px}
#products{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:15px;padding:15px}
.card{
background:linear-gradient(145deg,#202020,#0e0e0e);
border:1px solid #6e5616;border-radius:15px;overflow:hidden;
transition:.25s;box-shadow:0 0 10px #ffd70010
}
.card:hover{transform:translateY(-5px);border-color:#ffd700;box-shadow:0 0 22px #ffd70044}
.card img{width:100%;height:165px;object-fit:cover;background:#222}
.info{padding:12px}
.name{font-size:14px;min-height:35px;font-weight:bold}
.category{font-size:11px;color:#aaa;margin:6px 0}
.old{color:#999;text-decoration:line-through;font-size:12px}
.price{font-size:22px;font-weight:bold;color:#ffd700;text-shadow:0 0 8px #d6a000;margin:8px 0}
.discount{color:#5cff91;font-size:12px;font-weight:bold}
.coupon{color:#ffce5b;font-size:12px;margin-top:7px}
.buy{
display:block;text-align:center;margin-top:12px;padding:12px;
background:linear-gradient(90deg,#b8860b,#ffe36a,#c39212);
color:#111;font-weight:900;text-decoration:none;border-radius:9px;
box-shadow:0 0 12px #ffd70055
}
.buy:hover{filter:brightness(1.2)}
.empty{padding:30px;text-align:center;color:#aaa;grid-column:1/-1}
footer{text-align:center;padding:30px;color:#888;border-top:1px solid #4b3910;margin-top:25px}
</style>
</head>
<body>

<header>
<div class="logo">HUB<span>OFERTAS</span></div>
<p>✨ As melhores ofertas, em um só lugar ✨</p>
</header>

<section class="banner">
<h1>🔥 OFERTAS IMPERDÍVEIS 🔥</h1>
<p>Encontre tecnologia, moda, games e muito mais!</p>
</section>

<div class="search">
<input id="search" placeholder="🔎 O que você está procurando?" oninput="render()">
</div>

<div class="categories" id="categories">
<button class="active" onclick="filter('Todos',this)">🌟 Todos</button>
<button onclick="filter('Tecnologia',this)">📱 Tecnologia</button>
<button onclick="filter('Celulares',this)">📲 Celulares</button>
<button onclick="filter('Tablets',this)">📟 Tablets</button>
<button onclick="filter('Informática',this)">🖥️ Informática</button>
<button onclick="filter('Games',this)">🎮 Games</button>
<button onclick="filter('Roupas',this)">👕 Roupas</button>
<button onclick="filter('Calçados',this)">👟 Calçados</button>
<button onclick="filter('Casa',this)">🏠 Casa</button>
<button onclick="filter('Beleza',this)">💄 Beleza</button>
<button onclick="filter('Esportes',this)">⚽ Esportes</button>
<button onclick="filter('Acessórios',this)">🎧 Acessórios</button>
</div>

<div class="categories" id="prices">
<button class="active" onclick="filterPrice('Todos',this)">💎 Todos os preços</button>
<button onclick="filterPrice('Baratos',this)">💰 Baratinhos</button>
<button onclick="filterPrice('Medianos',this)">⭐ Intermediários</button>
<button onclick="filterPrice('Caros',this)">👑 Premium</button>
</div>

<h2>⚡ CATÁLOGO DE OFERTAS</h2>
<div class="resultado" id="count"></div>
<div id="products"></div>

<footer>
<div class="logo" style="font-size:24px">HUB<span>OFERTAS</span></div>
<p>Economize mais. Compre melhor.</p>
<p>© 2026 HubOfertas</p>
</footer>

const produtos = base.map((p,i)=>({
id:i,
nome:p[0],cat:p[1],preco:p[2],antigo:p[3],
foto:"https://images.unsplash.com/"+p[4]+"?auto=format&fit=crop&w=500&q=80",
link:p[5],loja:p[6]
}));

let categoria="Todos";
let faixa="Todos";

function filter(c,botao){
categoria=c;
document.querySelectorAll("#categories button").forEach(b=>b.classList.remove("active"));
botao.classList.add("active");
render();
}

function filterPrice(f,botao){
faixa=f;
document.querySelectorAll("#prices button").forEach(b=>b.classList.remove("active"));
botao.classList.add("active");
render();
}

function dinheiro(v){
return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}

function render(){
const busca=document.getElementById("search").value.toLowerCase();

const lista=produtos.filter(p=>{
const categoriaOK=categoria==="Todos"||p.cat===categoria;
const buscaOK=p.nome.toLowerCase().includes(busca)||p.loja.toLowerCase().includes(busca);
const precoOK=
faixa==="Todos"||
(faixa==="Baratos"&&p.preco<200)||
(faixa==="Medianos"&&p.preco>=200&&p.preco<1500)||
(faixa==="Caros"&&p.preco>=1500);
return categoriaOK&&buscaOK&&precoOK;
});

document.getElementById("count").textContent=
lista.length+" produtos encontrados";

document.getElementById("products").innerHTML=lista.length?
lista.map(p=>{
const desconto=Math.round((1-p.preco/p.antigo)*100);
return `
<article class="card">
<img src="${p.foto}" alt="${p.nome}" loading="lazy"
onerror="this.src='https://placehold.co/500x400/171717/ffd700?text=HubOfertas'">
<div class="info">
<div class="name">${p.nome}</div>
<div class="category">${p.cat} • ${p.loja}</div>
<div class="old">${dinheiro(p.antigo)}</div>
<div class="price">${dinheiro(p.preco)}</div>
<div class="discount">${desconto}% de desconto ilustrativo</div>
<div class="coupon">✨ Consulte cupons na loja</div>
<a class="buy" href="${p.link}" target="_blank" rel="noopener">VER OFERTA →</a>
</div>
</article>`;
}).join(""):'<div class="empty">Nenhum produto encontrado 😢</div>';
}
render();
</script>
